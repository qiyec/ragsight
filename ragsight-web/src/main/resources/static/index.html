<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ragsight · RAG 诊断</title>
<style>
/* ---------------------------------------------------------------
   设计说明
   - 不引外部字体/CSS 库：保持"clone 下来只要 JDK 和 Maven"
   - 色板集中成变量，语义色（good/warn/bad）只表达"结论的严重程度"
     和"数值的好坏"，不用于装饰
   - 数字一律等宽 + 定宽小数位，方便纵向比较
   - 热力图不只靠颜色：每列最优会加描边并加粗，颜色深浅只是辅助
   --------------------------------------------------------------- */
:root {
  --bg: #0b0d12;
  --surface: #12151c;
  --surface-2: #181c25;
  --surface-3: #1f2430;
  --border: #262c38;
  --border-strong: #333b4a;
  --text: #e8eaf0;
  --text-2: #a8b0c0;
  --text-3: #6f7889;
  --accent: #5b9dff;
  --accent-dim: #2a4a7f;
  --good: #43c463;
  --warn: #e0a63a;
  --bad: #ef5f5f;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  --radius-sm: 6px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------------- 布局：窄屏上下，宽屏左栏参数 ---------------- */
.app {
  display: grid;
  grid-template-columns: 1fr;
  min-height: 100vh;
}
@media (min-width: 1000px) {
  .app { grid-template-columns: 300px 1fr; }
}

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 22px 20px;
}
@media (min-width: 1000px) {
  .sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; }
}

.main { padding: 22px 26px 60px; min-width: 0; }

/* ---------------- 品牌区 ---------------- */
.brand { margin-bottom: 24px; }
.brand h1 {
  font-size: 16px; font-weight: 650; letter-spacing: -.01em;
  display: flex; align-items: center; gap: 8px;
}
.brand .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); flex: none;
}
.brand p {
  color: var(--text-3); font-size: 12px; margin-top: 5px; line-height: 1.45;
}

/* ---------------- 表单 ---------------- */
.field { margin-bottom: 15px; }
.field > label {
  display: block; font-size: 11px; font-weight: 600;
  color: var(--text-3); letter-spacing: .04em;
  text-transform: uppercase; margin-bottom: 6px;
}
select, input[type=text] {
  width: 100%; padding: 8px 10px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font: inherit; font-size: 13px;
}
select:hover, input[type=text]:hover { border-color: var(--border-strong); }
select:focus, input[type=text]:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(91,157,255,.14);
}

.switch {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 10px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border);
  cursor: pointer; user-select: none;
}
.switch:hover { border-color: var(--border-strong); }
.switch input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
.switch span { font-size: 13px; }
.switch.disabled { opacity: .45; cursor: not-allowed; }

.btn {
  width: 100%; padding: 10px; border: none; border-radius: var(--radius-sm);
  background: var(--accent); color: #06101f;
  font: inherit; font-size: 13px; font-weight: 650; cursor: pointer;
  transition: filter .12s, transform .06s;
}
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: default; }

.note {
  font-size: 11.5px; line-height: 1.55; color: var(--text-3);
  padding: 9px 10px; border-radius: var(--radius-sm);
  background: var(--surface-2); border-left: 2px solid var(--border-strong);
  margin-top: 12px;
}
.note.warn { border-left-color: var(--warn); color: var(--text-2); }

/* ---------------- 通用面板 ---------------- */
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 16px; overflow: hidden;
}
.panel-head {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
}
.panel-head h2 { font-size: 13.5px; font-weight: 650; }
.panel-head .meta { font-size: 12px; color: var(--text-3); margin-left: auto; }
.panel-body { padding: 18px; }
.panel-body.tight { padding: 0; }

/* ---------------- 指标卡 ---------------- */
.cards {
  display: grid; gap: 12px; margin-bottom: 16px;
  grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
}
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 15px 17px;
  display: flex; flex-direction: column;
}
.card .k {
  font-size: 11px; font-weight: 600; color: var(--text-3);
  letter-spacing: .04em; text-transform: uppercase;
}
.card .v {
  font-family: var(--mono); font-size: 25px; font-weight: 600;
  letter-spacing: -.02em; margin: 7px 0 3px; line-height: 1;
}
.card .s { font-size: 11.5px; color: var(--text-3); line-height: 1.4; margin-top: auto; }
.card .s b { color: var(--text-2); font-weight: 600; }
.card.hl { border-color: var(--accent-dim); background: linear-gradient(180deg, rgba(91,157,255,.07), transparent); }

/* 没有大数字的卡（比如"最优配置"），用文本承担主要信息 */
.card.text .v-text {
  font-size: 15px; font-weight: 600; color: var(--text);
  line-height: 1.35; margin: 8px 0 4px;
}
.card.text .v-text em {
  display: block; font-style: normal; color: var(--text-2);
  font-size: 12.5px; font-weight: 400; margin-top: 3px;
}

/* ---------------- 结论 ---------------- */
.findings { display: flex; flex-direction: column; gap: 9px; }
.finding {
  display: grid; grid-template-columns: 17px 1fr; gap: 11px;
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 13px; line-height: 1.6; color: var(--text-2);
}
.finding .ic { font-size: 13px; line-height: 1.45; text-align: center; }
/* 第一条是"基准表现如何"，是理解后面所有结论的前提，抬一级 */
.finding.lead {
  color: var(--text); background: var(--surface-3);
  border-color: var(--border-strong);
  font-size: 13.5px; padding: 13px 15px;
}
.finding.lead .ic { color: var(--text-2); }

/* 语义色只用在图标和左边框上，正文保持可读性 */
.finding.good { border-left: 2px solid var(--good); }
.finding.good .ic { color: var(--good); }
.finding.warn { border-left: 2px solid var(--warn); }
.finding.warn .ic { color: var(--warn); }
.finding.bad { border-left: 2px solid var(--bad); }
.finding.bad .ic { color: var(--bad); }
.finding.info { border-left: 2px solid var(--border-strong); }
.finding.info .ic { color: var(--text-3); }

/* ---------------- 热力图 ---------------- */
.hm-wrap { overflow-x: auto; }
table.hm { border-collapse: separate; border-spacing: 0; width: 100%; }
table.hm th {
  font-size: 11.5px; font-weight: 600; color: var(--text-3);
  padding: 0 0 9px; text-align: center;
}
table.hm th.rowhead {
  text-align: left; color: var(--text-2); font-weight: 500;
  padding: 0 14px 0 0; font-size: 12.5px; white-space: nowrap;
}
table.hm td {
  text-align: center; padding: 11px 12px;
  font-family: var(--mono); font-size: 13px; font-weight: 500;
  color: #06101f; border-right: 3px solid var(--surface);
  border-bottom: 3px solid var(--surface);
  min-width: 86px; transition: filter .12s;
}
table.hm td:first-of-type { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
table.hm td:last-of-type { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
table.hm td:hover { filter: brightness(1.08); }
/* 每列最优：加描边并加粗，不依赖颜色也能看出来 */
table.hm td.best {
  outline: 2px solid var(--text); outline-offset: -2px;
  font-weight: 700;
}
table.hm td.empty {
  background: var(--surface-2); color: var(--text-3); font-weight: 400;
  outline: none;
}
.hm-foot {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  margin-top: 14px; font-size: 11.5px; color: var(--text-3);
}
.scale { display: flex; align-items: center; gap: 8px; }
.scale .bar {
  width: 132px; height: 8px; border-radius: 4px;
  border: 1px solid var(--border);
}

/* ---------------- 明细表 ---------------- */
.tbl-wrap { overflow-x: auto; max-height: 460px; overflow-y: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.data th {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface-2); color: var(--text-3);
  font-size: 11px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; text-align: left;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.data th.num, table.data td.num { text-align: right; font-family: var(--mono); }
table.data td {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  color: var(--text-2); white-space: nowrap;
}
table.data tbody tr:hover td { background: var(--surface-2); }
table.data tr.base td { background: rgba(91,157,255,.055); }
table.data tr.base td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
table.data td.best { color: var(--text); font-weight: 650; }
table.data td.dim { color: var(--text-3); }
table.data td.plan { color: var(--text); }

.chip {
  display: inline-block; margin-left: 7px; padding: 1.5px 6px;
  border-radius: 4px; font-size: 10px; font-weight: 600;
  letter-spacing: .02em;
  background: var(--surface-3); color: var(--text-3);
  border: 1px solid var(--border-strong); vertical-align: 1px;
}
.chip.accent { color: var(--accent); border-color: var(--accent-dim); background: rgba(91,157,255,.1); }

/* ---------------- 状态 ---------------- */
.blank {
  color: var(--text-3); font-size: 13px; padding: 40px 20px;
  text-align: center; line-height: 1.7;
}
.error {
  background: rgba(239,95,95,.08); border: 1px solid rgba(239,95,95,.35);
  border-radius: var(--radius); padding: 15px 17px;
  font-size: 12.5px; line-height: 1.65; color: #ffc4c4;
  white-space: pre-wrap; font-family: var(--mono); margin-bottom: 16px;
}
.loading {
  display: flex; align-items: center; gap: 10px;
  color: var(--text-2); font-size: 13px; padding: 22px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 16px;
}
.spinner {
  width: 14px; height: 14px; border-radius: 50%; flex: none;
  border: 2px solid var(--border-strong); border-top-color: var(--accent);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">

  <!-- ============ 左侧：参数 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <h1><span class="dot"></span>ragsight</h1>
      <p>把 RAG 拆成能单独量的几步，看瓶颈在哪一段。<br>结论由固定规则从指标推导，不经过大模型。</p>
    </div>

    <div class="field">
      <label for="corpus">语料</label>
      <select id="corpus"></select>
    </div>

    <div class="field">
      <label for="chunkSize">切分窗口</label>
      <select id="chunkSize"></select>
    </div>

    <div class="field">
      <label for="topK">召回条数 topK</label>
      <select id="topK"></select>
    </div>

    <div class="field">
      <label class="switch" for="rerank">
        <input type="checkbox" id="rerank" checked>
        <span>顺便对比重排</span>
      </label>
    </div>

    <div class="field">
      <label class="switch" for="useReal" id="useRealWrap">
        <input type="checkbox" id="useReal">
        <span>用真实向量模型</span>
      </label>
    </div>

    <div class="field" id="modelField" style="display:none">
      <label for="model">模型名</label>
      <input type="text" id="model" value="text-embedding-v4">
    </div>

    <button class="btn" id="run">跑诊断</button>

    <div class="note" id="embeddingHint"></div>
  </aside>

  <!-- ============ 右侧：结果 ============ -->
  <main class="main">
    <div id="error" class="error hidden"></div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <span id="loadingText">正在跑诊断……</span>
    </div>

    <div id="blank" class="panel">
      <div class="blank">正在读取可选项……</div>
    </div>

    <div id="results" class="hidden">

      <!-- 关键指标 -->
      <div class="cards" id="cards"></div>

      <!-- 结论 -->
      <section class="panel">
        <div class="panel-head">
          <h2>诊断结论</h2>
          <span class="meta" id="resultMeta"></span>
        </div>
        <div class="panel-body">
          <div class="findings" id="findings"></div>
        </div>
      </section>

      <!-- 热力图 -->
      <section class="panel">
        <div class="panel-head">
          <h2>实验矩阵</h2>
          <span class="meta" id="hmMetric"></span>
        </div>
        <div class="panel-body">
          <div class="hm-wrap"><table class="hm" id="heatmap"></table></div>
          <div class="hm-foot" id="hmFoot"></div>
        </div>
      </section>

      <!-- 明细 -->
      <section class="panel">
        <div class="panel-head">
          <h2>指标明细</h2>
          <span class="meta">每列最优值已加粗</span>
        </div>
        <div class="panel-body tight">
          <div class="tbl-wrap"><table class="data" id="table"></table></div>
        </div>
      </section>

    </div>
  </main>
</div>

<script>
// 极简前端：不引框架、不引图表库、不打包。
// 逻辑就是"拿数据 → 填 DOM"，这个规模用不着那些东西。

const $ = id => document.getElementById(id);
let options = null;
const ICONS = { GOOD: '✔', WARN: '!', BAD: '×', INFO: '·' };

// ---------------------------------------------------------------
// 打开方式检查
//
// 最常见的坑：直接双击打开这个 HTML（地址栏是 file:///...）。
// 那样页面里的 api/options 会去找本地文件，必然失败，
// 而报错只有一句"连不上服务"，看不出原因。先拦一下。
// ---------------------------------------------------------------
if (location.protocol === 'file:') {
  showError(
    '这个页面要通过服务访问，不能直接双击打开文件。\n\n' +
    '当前地址：' + location.href + '\n' +
    '这是本地文件路径，不是服务地址，所以请求接口必然失败。\n\n' +
    '正确做法：\n' +
    '  1. 在仓库根目录启动服务：\n' +
    '       java -jar ragsight-web/target/ragsight-web.jar\n' +
    '  2. 等它打印出 Started RagsightWebApplication 之后，\n' +
    '     在浏览器地址栏输入： http://localhost:8080\n\n' +
    '注意是"在地址栏输入地址"，不是"打开文件"。'
  );
  document.getElementById('blank').classList.add('hidden');
}

// ---------------------------------------------------------------
// 初始化
// ---------------------------------------------------------------
async function loadOptions() {
  if (location.protocol === 'file:') return;

  try {
    const resp = await fetch('api/options');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    options = await resp.json();
  } catch (e) {
    const requested = new URL('api/options', location.href).href;
    showError(
      '连不上服务。\n\n' +
      '当前页面：' + location.href + '\n' +
      '请求接口：' + requested + '\n' +
      '失败原因：' + e + '\n\n' +
      '检查一下：\n' +
      '  1. 服务是不是还在运行？（命令行窗口关掉，服务就停了）\n' +
      '  2. 页面地址是不是 http://localhost:8080 ？\n' +
      '  3. 改过端口的话，页面也要用对应端口访问。'
    );
    document.getElementById('blank').classList.add('hidden');
    return;
  }

  fillSelect($('corpus'), options.corpora.map(c => ({
    value: c.id, label: c.name, title: c.description
  })), options.defaultCorpusId);
  fillSelect($('chunkSize'), options.chunkSizes.map(v => ({ value: v, label: v + ' 字' })), 90);
  fillSelect($('topK'), options.topKs.map(v => ({ value: v, label: v + ' 条' })), 5);

  $('corpus').addEventListener('change', updateCorpusHint);
  updateCorpusHint();

  // 环境里没有 Key 就把开关禁掉，免得点了报错还不知道为什么
  const real = options.realEmbeddingConfigured;
  $('useReal').disabled = !real;
  if (!real) $('useRealWrap').classList.add('disabled');
  $('useReal').addEventListener('change', () => {
    $('modelField').style.display = $('useReal').checked ? '' : 'none';
  });
  $('embeddingHint').textContent = options.embeddingHint;
  $('embeddingHint').className = 'note' + (real ? '' : ' warn');

  runDiagnosis();
}

function fillSelect(el, items, defaultValue) {
  el.innerHTML = '';
  for (const it of items) {
    const o = document.createElement('option');
    o.value = it.value;
    o.textContent = it.label;
    if (it.title) o.title = it.title;
    if (String(it.value) === String(defaultValue)) o.selected = true;
    el.appendChild(o);
  }
}

function updateCorpusHint() {
  const sel = options.corpora.find(c => c.id === $('corpus').value);
  if (sel) $('corpus').title = sel.description;
}

// ---------------------------------------------------------------
// 跑诊断
// ---------------------------------------------------------------
async function runDiagnosis() {
  if (!options) return;

  $('run').disabled = true;
  $('error').classList.add('hidden');
  $('results').classList.add('hidden');
  $('blank').classList.add('hidden');
  $('loading').classList.remove('hidden');

  const plans = 2 + ($('rerank').checked ? 1 : 0);
  $('loadingText').textContent = `正在跑 ${plans} 种切分 × 3 种召回 = ${plans * 3} 次实验……`;

  const body = {
    corpusId: $('corpus').value,
    chunkSize: Number($('chunkSize').value),
    topK: Number($('topK').value),
    includeRerank: $('rerank').checked,
    embeddingEnabled: $('useReal').checked,
    embeddingModel: $('model').value
  };

  try {
    const resp = await fetch('api/diagnose', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    if (!resp.ok) { showError(data.message || '诊断失败'); return; }
    render(data);
  } catch (e) {
    showError('请求失败：' + e);
  } finally {
    $('run').disabled = false;
    $('loading').classList.add('hidden');
  }
}

function showError(msg) {
  const el = $('error');
  el.textContent = msg;
  el.classList.remove('hidden');
  $('loading').classList.add('hidden');
  $('blank').classList.add('hidden');
  $('run').disabled = false;
}

// ---------------------------------------------------------------
// 渲染
// ---------------------------------------------------------------
function render(d) {
  $('results').classList.remove('hidden');

  $('resultMeta').textContent =
    `${d.caseCount} 个用例（负样本 ${d.negativeCaseCount}） · ${d.experimentCount} 次实验 · ${d.elapsedMillis} ms`;

  renderCards(d);
  renderFindings(d.findings);
  renderHeatmap(d.heatmap);
  renderTable(d);
}

/**
 * 顶部指标卡。
 *
 * 第一张卡是"最优配置"——它没有单个大数字，用的是"方案名 + 召回方式"两行文本。
 * 所以单独处理，避免出现"标签孤零零挂着、大数字区域空着"的怪异观感。
 */
function renderCards(d) {
  const box = $('cards');
  box.innerHTML = '';

  const baseline = d.rows.find(r => r.baseline);
  const mrrKey = d.metricNames[1];           // 用 MRR 找最优，它最能体现排序质量
  const best = d.rows.reduce((a, b) =>
    (b.scores[mrrKey] > a.scores[mrrKey] ? b : a), d.rows[0]);
  const gain = best.scores[mrrKey] - baseline.scores[mrrKey];
  const gainText = Math.abs(gain) < 0.005
    ? '和基准基本持平'
    : (gain > 0 ? `比基准高 ${gain.toFixed(3)}` : `比基准低 ${Math.abs(gain).toFixed(3)}`);

  // 第一张：最优配置（文本卡）
  const c1 = document.createElement('div');
  c1.className = 'card text' + (gain >= 0.05 ? ' hl' : '');
  c1.title = `共 ${d.experimentCount} 次实验中排序质量最高的一组`;
  c1.innerHTML =
    `<div class="k">最优配置</div>` +
    `<div class="v-text">${esc(best.retrieverLabel)}<em>${esc(best.chunkingLabel)}` +
    (best.reranked ? '（含重排）' : '') + `</em></div>` +
    `<div class="s">${esc(gainText)}</div>`;
  box.appendChild(c1);

  // 第二张：最优的 MRR
  const verdict = gain >= 0.05 ? '提升明显，值得采用'
                : (gain > -0.005 ? '差距不大，不必折腾' : '反而不如基准');
  addCard(box, mrrKey, best.scores[mrrKey].toFixed(3),
          `基准 ${baseline.scores[mrrKey].toFixed(3)} · ${esc(verdict)}`,
          gain >= 0.05,
          `最优配置的 ${mrrKey}，以及它相对基准（${baseline.chunkingLabel} · ${baseline.retrieverLabel}）的差距`);

  // 第三张：召回率
  const rKey = d.metricNames[0];
  addCard(box, '召回率 ' + rKey, best.scores[rKey].toFixed(3),
          '基准 ' + baseline.scores[rKey].toFixed(3),
          false,
          '召回率是上限：它低的话，排序再怎么优化也提升不了最终效果');

  // 第四张：用例数
  addCard(box, '用例数', String(d.caseCount),
          d.negativeCaseCount === 0
            ? '⚠ 没有负样本'
            : `其中负样本 ${d.negativeCaseCount} 个`,
          false,
          d.negativeCaseCount === 0
            ? '测试集里没有「本来就该答不出来」的问题，检索器可能靠「总是返回最相似内容」拿虚高分'
            : '含负样本，分数不容易虚高');
}

function addCard(box, key, value, sub, highlight, title) {
  const el = document.createElement('div');
  el.className = 'card' + (highlight ? ' hl' : '');
  if (title) el.title = title;
  el.innerHTML =
    `<div class="k">${esc(key)}</div>` +
    `<div class="v">${esc(value)}</div>` +
    `<div class="s">${sub}</div>`;
  box.appendChild(el);
}

/**
 * 结论。
 *
 * 第一条是"基准表现如何"——它是理解后面所有结论的前提，所以视觉上抬一级。
 * 其余按语义色区分，但颜色只用在图标和左边框上，正文保持正常对比度。
 */
function renderFindings(findings) {
  const box = $('findings');
  box.innerHTML = '';

  findings.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'finding ' + f.level.toLowerCase();
    if (i === 0) div.classList.add('lead');

    const ic = document.createElement('div');
    ic.className = 'ic';
    ic.textContent = ICONS[f.level] || '·';

    const tx = document.createElement('div');
    tx.textContent = f.text;

    div.append(ic, tx);
    box.appendChild(div);
  });
}

/** 简易转义。数据都来自本地，但仍然不该让文案里的尖括号破坏 DOM。 */
function esc(s) {
  return String(s).replace(/[&<>"]/g, ch =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}

/**
 * 热力图。
 *
 * 关键：**不只靠颜色**。颜色深浅只是辅助，每列最优会额外加描边并加粗，
 * 这样即使分不清颜色深浅（色觉差异、屏幕差），也能看出哪个最好。
 */
function renderHeatmap(hm) {
  $('hmMetric').textContent = hm.metricName;

  const table = $('heatmap');
  table.innerHTML = '';

  const nCols = hm.columnLabels.length;

  // 每列的最优值，用来加描边
  const colBest = [];
  for (let c = 0; c < nCols; c++) {
    let best = -Infinity;
    for (let r = 0; r < hm.rowLabels.length; r++) {
      const v = hm.values[r][c];
      if (!Number.isNaN(v) && v > best) best = v;
    }
    colBest.push(best);
  }

  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  const corner = document.createElement('th');
  corner.className = 'rowhead';
  hr.appendChild(corner);
  for (const col of hm.columnLabels) {
    const th = document.createElement('th');
    th.textContent = col;
    hr.appendChild(th);
  }
  thead.appendChild(hr);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  const span = Math.max(hm.maxValue - hm.minValue, 1e-9);

  for (let r = 0; r < hm.rowLabels.length; r++) {
    const tr = document.createElement('tr');

    const th = document.createElement('th');
    th.className = 'rowhead';
    th.textContent = hm.rowLabels[r];
    tr.appendChild(th);

    for (let c = 0; c < nCols; c++) {
      const td = document.createElement('td');
      const v = hm.values[r][c];

      if (Number.isNaN(v)) {
        td.className = 'empty';
        td.textContent = '—';
      } else {
        const t = (v - hm.minValue) / span;
        // 明度 84% → 46%，色相 212 → 186：值越高越亮越青
        td.style.background = `hsl(${212 - t * 26}, 72%, ${84 - t * 38}%)`;
        td.textContent = v.toFixed(3);
        if (Math.abs(v - colBest[c]) < 1e-9) td.classList.add('best');
        td.title = `${hm.rowLabels[r]} / ${hm.columnLabels[c]}：${v.toFixed(4)}`;
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);

  $('hmFoot').innerHTML = '';

  const scale = document.createElement('div');
  scale.className = 'scale';
  const lo = document.createElement('span');
  lo.textContent = hm.minValue.toFixed(3);
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.style.background = 'linear-gradient(90deg, hsl(212,72%,84%), hsl(186,72%,46%))';
  const hi = document.createElement('span');
  hi.textContent = hm.maxValue.toFixed(3);
  scale.append(lo, bar, hi);

  const desc = document.createElement('span');
  desc.textContent = `颜色越亮越高；描边是每列最优。行＝切分方案，列＝召回方式。`;

  $('hmFoot').append(scale, desc);
}

/**
 * 明细表。
 *
 * 每列最优值加粗，基准行高亮，并且加一列"相对基准"——
 * 用户关心的不是绝对值，是"比现状好多少"。
 */
function renderTable(d) {
  const table = $('table');
  table.innerHTML = '';

  const mrrKey = d.metricNames[1];

  // 每列最优
  const bestByMetric = {};
  for (const m of d.metricNames) {
    bestByMetric[m] = d.rows.reduce((a, b) => (b.scores[m] > a.scores[m] ? b : a), d.rows[0]).scores[m];
  }

  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  for (const [txt, num] of [['切分方案', 0], ['召回方式', 0],
                            ...d.metricNames.map(m => [m, 1]),
                            ['相对基准（' + mrrKey + '）', 1]]) {
    const th = document.createElement('th');
    th.textContent = txt;
    if (num) th.className = 'num';
    hr.appendChild(th);
  }
  thead.appendChild(hr);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  for (const row of d.rows) {
    const tr = document.createElement('tr');
    if (row.baseline) tr.className = 'base';

    const tdPlan = document.createElement('td');
    tdPlan.className = 'plan';
    tdPlan.textContent = row.chunkingLabel;
    if (row.reranked) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = '重排';
      tdPlan.appendChild(chip);
    }

    const tdRet = document.createElement('td');
    tdRet.textContent = row.retrieverLabel;
    if (row.baseline) {
      const chip = document.createElement('span');
      chip.className = 'chip accent';
      chip.textContent = '基准';
      tdRet.appendChild(chip);
    }

    tr.append(tdPlan, tdRet);

    for (const m of d.metricNames) {
      const td = document.createElement('td');
      td.className = 'num';
      const v = row.scores[m];
      td.textContent = Number.isNaN(v) ? '—' : v.toFixed(3);
      if (Math.abs(v - bestByMetric[m]) < 1e-9) td.classList.add('best');
      tr.appendChild(td);
    }

    const tdDelta = document.createElement('td');
    tdDelta.className = 'num';
    const dm = row.deltas[mrrKey];
    if (dm === undefined || dm === null || Number.isNaN(dm)) {
      tdDelta.textContent = '—';
      tdDelta.classList.add('dim');
    } else if (Math.abs(dm) < 0.005) {
      tdDelta.textContent = '±0.000';
      tdDelta.classList.add('dim');
    } else {
      tdDelta.textContent = (dm > 0 ? '+' : '') + dm.toFixed(3);
      // 用语义色 + 符号双重表达，不只靠颜色
      tdDelta.style.color = dm > 0 ? 'var(--good)' : 'var(--bad)';
      tdDelta.style.fontWeight = '600';
    }
    tr.appendChild(tdDelta);

    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
}

$('run').addEventListener('click', runDiagnosis);
$('rerank').addEventListener('change', runDiagnosis);
loadOptions();
</script>
