# ArchUnit 配置。
#
# archRule.failOnEmptyShould=true 的含义：如果某条规则"一个类都没匹配到"，
# 直接判为失败。
#
# 为什么必须是 true：规则写错包名、或者包被改名后，规则会静默失效——
# 构建照样通过，但实际什么都没检查。这种"以为有门禁、其实没有"的状态
# 比没有门禁更危险，因为它会让人放松警惕。
#
# 曾经短暂设为 false：早期 ragsight-application 还是空模块，
# 针对它的规则匹配不到类会被判失败。现在该模块已有真实代码，改回 true。
archRule.failOnEmptyShould=true
