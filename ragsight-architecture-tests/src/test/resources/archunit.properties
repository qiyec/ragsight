# ArchUnit 配置。
#
# archRule.failOnEmptyShould=false 的含义：当某条规则"没有匹配到任何类"时
# 不判为失败。
#
# 为什么现在必须设成 false：
#   ragsight-application 模块目前还是空的（P2 才开始写用例编排），
#   针对它的规则匹配不到类，ArchUnit 默认会把"没检查到任何类"当成失败。
#
# ⚠️ 技术债：等 application 模块有了真实类，应把此项改为 true，
#    否则规则被意外写空时将不再报警，架构门禁会静默失效。
#    跟踪记录见 PROGRESS.md。
archRule.failOnEmptyShould=false
